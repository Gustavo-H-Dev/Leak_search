{% extends "base.html" %}
{% block titulo %}Alterar senha{% endblock %}
{% block conteudo %}
<section class="auth-card">
  <span class="eyebrow">SEGURANÇA</span>
  <h1>Alterar senha</h1>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  {% if mensagem %}<p class="sucesso">{{ mensagem }}</p>{% endif %}
  <form method="post" action="/alterar-senha">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field-label" for="current-password">Senha atual</label>
    <input id="current-password" name="senha_atual" type="password" autocomplete="current-password" required>
    <label class="field-label" for="new-password">Nova senha (mínimo 12 caracteres)</label>
    <input id="new-password" name="senha" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <label class="field-label" for="new-password-confirm">Confirme a nova senha</label>
    <input id="new-password-confirm" name="confirmar_senha" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Alterar senha</button>
  </form>
</section>
{% endblock %}
