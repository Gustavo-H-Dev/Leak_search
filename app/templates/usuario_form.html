{% extends "base.html" %}
{% block titulo %}Novo usuário{% endblock %}
{% block conteudo %}
<section class="auth-card">
  <h1>Novo usuário</h1>
  <p>Defina uma senha inicial e informe-a ao usuário por um meio seguro.</p>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/usuarios">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="field-label" for="username">Usuário</label>
    <input id="username" name="username" minlength="3" maxlength="32" autocomplete="off" required>
    <label class="field-label" for="email">E-mail</label>
    <input id="email" name="email" type="email" required>
    <label class="field-label" for="nome-publico">Nome público</label>
    <input id="nome-publico" name="nome_publico" maxlength="80" required>
    <label class="field-label" for="arroba">Instagram (@)</label>
    <input id="arroba" name="arroba" maxlength="31" required>
    <label class="field-label" for="senha">Senha inicial (mínimo 12 caracteres)</label>
    <input id="senha" name="senha" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <label class="field-label" for="confirmar-senha">Confirme a senha</label>
    <input id="confirmar-senha" name="confirmar_senha" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <button type="submit">Criar usuário</button>
    <a class="button button-secondary" href="/usuarios">Cancelar</a>
  </form>
</section>
{% endblock %}
