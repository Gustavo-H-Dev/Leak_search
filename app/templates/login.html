{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="auth-card">
  <span class="eyebrow">ACESSO RESTRITO</span>
  <h1>Entrar</h1>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  {% if mensagem %}<p class="sucesso">{{ mensagem }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field-label" for="login-username">Usuário ou e-mail</label>
    <input id="login-username" name="username" autocomplete="username" required>
    <label class="field-label" for="login-password">Senha</label>
    <input id="login-password" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
  <p><a href="/esqueci-senha">Esqueci minha senha</a></p>
  <p>Não tem conta? <a href="/cadastro">Cadastre-se</a>.</p>
</section>
{% endblock %}
