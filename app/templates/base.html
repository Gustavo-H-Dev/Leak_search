<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111014">
  <title>{% block titulo %}Monitoramento{% endblock %}</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111014;
      --surface: #19171d;
      --surface-raised: #201d24;
      --border: #302b34;
      --text: #f5f0f5;
      --muted: #aaa1ad;
      --pink: #f078ad;
      --pink-light: #ffacd0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(ellipse at 75% -15%, rgb(148 49 97 / 16%), transparent 42rem),
        var(--background);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .site-header {
      border-bottom: 1px solid rgb(255 255 255 / 7%);
      background: rgb(17 16 20 / 78%);
    }

    .header-inner {
      width: min(1120px, calc(100% - 3rem));
      min-height: 76px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      text-decoration: none;
      font-size: .96rem;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgb(240 120 173 / 45%);
      border-radius: 11px;
      color: var(--pink-light);
      background: linear-gradient(145deg, rgb(240 120 173 / 20%), rgb(240 120 173 / 5%));
      font-size: .72rem;
      letter-spacing: .04em;
    }

    .main-nav { display: flex; align-items: center; gap: .35rem; }

    .main-nav a {
      padding: .62rem .9rem;
      border-radius: 9px;
      color: var(--muted);
      text-decoration: none;
      font-size: .88rem;
      transition: color .18s ease, background .18s ease;
    }

    .main-nav a:hover, .main-nav a:focus-visible {
      color: var(--text);
      background: rgb(255 255 255 / 6%);
      outline: none;
    }

    .main-nav a.nav-highlight {
      color: var(--pink-light);
      background: rgb(240 120 173 / 9%);
    }

    .main-nav a.nav-highlight:hover { background: rgb(240 120 173 / 16%); }
    .nav-user { padding: .62rem .45rem; color: var(--muted); font-size: .82rem; }
    .nav-logout { margin: 0; }
    .nav-logout button { min-height: 34px; margin: 0; padding: .45rem .7rem; }

    .page-content {
      width: min(1120px, calc(100% - 3rem));
      margin: 0 auto;
      padding: 3.5rem 0 5rem;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { letter-spacing: -.035em; }
    h1 { font-size: clamp(2rem, 5vw, 3.65rem); line-height: 1.08; }
    h2 { font-size: 1.45rem; }
    h3 { font-size: 1.12rem; }
    p { color: var(--muted); line-height: 1.7; }

    .hero {
      min-height: 405px;
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(290px, .85fr);
      align-items: center;
      gap: clamp(2rem, 7vw, 6rem);
      padding: 1rem 0 4.5rem;
      border-bottom: 1px solid rgb(255 255 255 / 8%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--pink-light);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 12px rgb(240 120 173 / 75%);
    }

    .hero h1 { max-width: 650px; margin: 1.1rem 0 1rem; }
    .hero h1 span { color: var(--pink); }
    .hero-description { max-width: 500px; margin-bottom: 1.8rem; font-size: 1rem; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; }

    .button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      padding: .72rem 1rem;
      border: 1px solid transparent;
      border-radius: 10px;
      text-decoration: none;
      font-size: .88rem;
      font-weight: 650;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button-primary { color: #21131a; background: var(--pink); }
    .button-primary:hover { background: var(--pink-light); }
    .button-secondary { border-color: var(--border); color: var(--text); background: var(--surface); }
    .button-secondary:hover { border-color: #51434e; }

    .hero-panel {
      overflow: hidden;
      padding: 1.1rem;
      border: 1px solid #38303a;
      border-radius: 18px;
      background: linear-gradient(145deg, #211d25, #17151a 72%);
      box-shadow: 0 25px 80px rgb(0 0 0 / 25%), inset 0 1px rgb(255 255 255 / 3%);
    }

    .panel-topline { display: flex; justify-content: space-between; gap: 1rem; }
    .panel-label, .panel-indicator { font-size: .62rem; font-weight: 700; letter-spacing: .1em; }
    .panel-label { color: var(--muted); }
    .panel-indicator { color: var(--pink); }

    .scan-visual {
      min-height: 205px;
      display: grid;
      place-items: center;
      margin: 1rem 0;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 5%);
      border-radius: 12px;
      background:
        linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px),
        radial-gradient(ellipse at center, rgb(165 64 111 / 18%), transparent 70%),
        #17151b;
      background-size: 24px 24px, 24px 24px, auto, auto;
    }

    .scan-frame { position: relative; width: 130px; height: 130px; display: grid; place-items: center; }
    .scan-orbit { position: absolute; border: 1px solid rgb(240 120 173 / 22%); border-radius: 50%; }
    .orbit-one { inset: 3px; }
    .orbit-two { inset: 20px; border-color: rgb(240 120 173 / 35%); }
    .scan-core {
      width: 42px;
      height: 42px;
      border: 1px solid rgb(255 172 208 / 72%);
      border-radius: 14px;
      background: linear-gradient(145deg, rgb(240 120 173 / 35%), rgb(240 120 173 / 8%));
      box-shadow: 0 0 32px rgb(240 120 173 / 23%);
      transform: rotate(45deg);
    }

    .scan-line {
      position: absolute;
      z-index: 1;
      width: 90px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--pink-light), transparent);
      box-shadow: 0 0 9px var(--pink);
      transform: rotate(-35deg);
    }

    .scan-corner { position: absolute; width: 12px; height: 12px; border-color: var(--pink-light); border-style: solid; }
    .corner-top-left { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .corner-top-right { top: 0; right: 0; border-width: 1px 1px 0 0; }
    .corner-bottom-left { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
    .corner-bottom-right { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    .panel-caption { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .panel-caption strong { font-size: .88rem; }
    .panel-caption p { margin: .25rem 0 0; font-size: .77rem; }
    .panel-arrow { color: var(--pink-light); font-size: 1.15rem; }

    .workflows { padding-top: 3.2rem; }
    .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 2rem; margin-bottom: 1.4rem; }
    .section-heading .eyebrow { margin-bottom: .7rem; font-size: .65rem; }
    .section-heading h2 { margin-bottom: 0; }
    .section-heading > p { max-width: 300px; margin-bottom: .1rem; font-size: .85rem; }
    .workflow-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }

    .workflow-card {
      position: relative;
      min-height: 218px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 1.35rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(145deg, rgb(255 255 255 / 2%), transparent 65%), var(--surface);
      text-decoration: none;
      transition: border-color .18s ease, transform .18s ease, background .18s ease;
    }

    .workflow-card:hover, .workflow-card:focus-visible {
      border-color: rgb(240 120 173 / 52%);
      background-color: #1d1920;
      outline: none;
      transform: translateY(-2px);
    }

    .card-icon {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      margin-bottom: 1.2rem;
      border: 1px solid rgb(240 120 173 / 25%);
      border-radius: 11px;
      color: var(--pink-light);
      background: rgb(240 120 173 / 8%);
      font-size: .72rem;
      font-weight: 700;
    }

    .card-link { position: absolute; top: 1.35rem; right: 1.35rem; color: #827984; }
    .workflow-card h3 { margin-bottom: .45rem; }
    .workflow-card p { max-width: 420px; margin-bottom: 1.15rem; font-size: .84rem; }
    .card-action { margin-top: auto; color: var(--pink-light); font-size: .82rem; font-weight: 650; }
    .card-action span { margin-left: .3rem; }

    .search-page { max-width: 820px; margin: 0 auto; }
    .auth-card {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: clamp(1.25rem, 5vw, 2rem);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(145deg, rgb(255 255 255 / 2%), transparent 65%), var(--surface);
      box-shadow: 0 24px 70px rgb(0 0 0 / 18%);
    }
    .auth-card > .eyebrow { margin-bottom: .8rem; }
    .auth-card h1 { margin-bottom: .8rem; font-size: clamp(2rem, 6vw, 2.8rem); }
    .auth-card form { display: grid; gap: .55rem; margin: 1.4rem 0; }
    .auth-card .field-label { margin: .4rem 0 0; font-size: .88rem; }
    .auth-card input { width: 100%; margin: 0; }
    .auth-card button { justify-self: start; margin-top: .5rem; }
    .auth-card p { font-size: .9rem; }
    .auth-card p a { color: var(--pink-light); }
    .resend-details { margin-top: 1.5rem; color: var(--muted); font-size: .9rem; }
    .resend-details summary { cursor: pointer; }
    .search-page h1 { margin: .8rem 0 1rem; }
    .search-intro { max-width: 740px; }
    .search-form {
      margin: 2rem 0;
      padding: 1.4rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .field-label { display: block; margin-bottom: .65rem; font-weight: 650; }
    .search-form input[type="file"] { display: block; width: 100%; margin: 0; }
    .privacy-note { margin: 1rem 0; font-size: .82rem; }
    .privacy-note a, .search-result-list a { color: var(--pink-light); }
    .consent-control { display: flex; align-items: flex-start; gap: .65rem; margin: 1.25rem 0; }
    .consent-control input { flex: 0 0 auto; width: 17px; min-height: 17px; margin: .18rem 0 0; accent-color: var(--pink); }
    .consent-control span { color: #ded7e0; font-size: .86rem; line-height: 1.5; }
    .search-results { margin-top: 2.5rem; }
    .search-results h2 { margin: 1.8rem 0 .85rem; }
    .search-result-list { display: grid; gap: .7rem; margin: 0; padding: 0; list-style: none; }
    .search-result-list li { display: grid; gap: .3rem; padding: .9rem 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    .search-result-list a { width: fit-content; font-weight: 650; overflow-wrap: anywhere; }
    .search-result-list span { color: var(--muted); font-size: .78rem; overflow-wrap: anywhere; }
    .search-result-list .official-site-badge, .official-site-badge {
      width: fit-content;
      padding: .3rem .55rem;
      border: 1px solid #456b55;
      border-radius: 999px;
      color: #b7e8c5;
      background: #192a21;
      font-size: .72rem;
      font-weight: 650;
    }
    .result-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .result-actions form { display: inline-flex; gap: .5rem; margin: 0; }
    .result-actions button, .result-actions .button { min-height: 34px; padding: .45rem .7rem; font-size: .78rem; }
    .result-actions .button-danger { border: 1px solid #754052; color: #ffd9e8; background: #422331; }
    .result-action-status { margin-top: .25rem; font-size: .8rem; }
    .profile-section { margin: 2rem 0; }
    .profile-search-form { display: grid; gap: .65rem; }
    .profile-search-form .field-label { margin: .25rem 0 0; }
    .profile-search-form input { width: 100%; margin: 0; }
    .profile-search-form button { justify-self: start; margin-top: .4rem; }
    .profile-photo-list, .profile-site-list { display: grid; gap: .65rem; margin: 0; padding: 0; list-style: none; }
    .profile-photo-list li, .profile-site-list li {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .65rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
    }
    .profile-photo-list img { width: 64px; height: 64px; border-radius: 7px; object-fit: cover; }
    .profile-photo-list span, .profile-site-list span { flex: 1; overflow-wrap: anywhere; color: var(--muted); font-size: .83rem; }
    .profile-photo-list form { margin: 0; }
    .profile-site-list { align-items: stretch; }
    .profile-site-list li { align-items: flex-start; flex-direction: column; gap: .2rem; }
    .official-sites {
      max-width: 820px;
      margin: 2rem 0;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .official-sites h2 { margin-bottom: .5rem; }
    .official-sites > p { font-size: .86rem; }
    .official-sites > form {
      display: grid;
      grid-template-columns: minmax(130px, 190px) minmax(0, 1fr);
      align-items: center;
      gap: .6rem;
    }
    .official-sites .field-label { margin: 0; }
    .official-sites input, .official-sites select { width: 100%; min-width: 0; margin: 0; }
    .official-sites > form button { grid-column: 2; justify-self: start; }
    .official-page-list { display: grid; gap: .8rem; margin-top: 1rem; }
    .official-page-item { padding: 1rem; border: 1px solid var(--border); border-radius: 10px; background: #151319; }
    .official-page-item .api-status { font-size: .78rem; }
    .official-page-edit {
      display: grid;
      grid-template-columns: minmax(130px, 190px) minmax(0, 1fr);
      align-items: center;
      gap: .6rem;
    }
    .official-page-edit button { grid-column: 2; justify-self: start; }
    .official-page-item > form:not(.official-page-edit) { display: block; margin: .75rem 0 0; }
    .creator-create, .creators-list { margin: 2rem 0; }
    .creator-create {
      max-width: 820px;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .creator-create > p, .creator-card p { color: var(--muted); font-size: .86rem; }
    .creator-create form { display: grid; gap: .55rem; }
    .creator-create .field-label { margin: .25rem 0 0; }
    .creator-create input[type="file"] { width: 100%; }
    .creator-create button { justify-self: start; margin-top: .5rem; }
    .creators-list { display: grid; gap: 1rem; }
    .creator-card {
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .creator-card h3 { margin: 0 0 1rem; font-size: 1.25rem; }
    .creator-children { margin-top: 1.25rem; }
    .creator-children h4 { margin: 0 0 .65rem; }
    .creator-child-form {
      display: grid;
      grid-template-columns: minmax(130px, 190px) minmax(0, 1fr);
      align-items: center;
      gap: .6rem;
      margin-top: 1rem;
    }
    .creator-child-form .field-label { margin: 0; }
    .creator-child-form input { width: 100%; min-width: 0; margin: 0; }
    .creator-child-form button { grid-column: 2; justify-self: start; }
    .creator-content-list { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; }
    .creator-content-list li {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .6rem;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #151319;
    }
    .creator-content-list li span { flex: 1; overflow-wrap: anywhere; font-size: .85rem; }
    .creator-content-list form { margin: 0; }
    .api-status { padding: .75rem 1rem; border: 1px solid var(--border); border-radius: 9px; font-size: .85rem; }
    .api-status-ready { border-color: #3d6652; color: #a9e3be; background: #192a21; }
    .api-status-missing { border-color: #765d34; color: #f0d7a4; background: #2e281b; }
    .api-status code { color: var(--pink-light); }
    .account-usage {
      margin: 1.5rem 0;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(145deg, rgb(240 120 173 / 5%), transparent 75%), var(--surface);
    }
    .account-usage-heading { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .account-usage-heading .eyebrow { font-size: .65rem; }
    .account-usage-heading h2 { margin: .45rem 0 0; font-size: 1.2rem; }
    .account-usage-heading form { margin: 0; }
    .account-usage-heading button { white-space: nowrap; }
    .account-usage-summary { margin: 1rem 0 .4rem; }
    .account-usage-summary strong { color: var(--text); }
    .usage-progress { display: block; width: 100%; height: 9px; margin: .8rem 0 1rem; accent-color: var(--pink); }
    .account-usage-details { display: flex; flex-wrap: wrap; gap: .75rem 2rem; margin: 1rem 0 .4rem; }
    .account-usage-details div { display: flex; gap: .4rem; font-size: .82rem; }
    .account-usage-details dt { color: var(--muted); }
    .account-usage-details dd { margin: 0; color: var(--text); font-weight: 650; }
    .account-usage-note { margin: .75rem 0 0; font-size: .76rem; }
    .serpapi-sections { display: grid; gap: 1rem; margin-top: 2rem; }
    .serpapi-card { padding: 1.25rem; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
    .serpapi-card .eyebrow { font-size: .65rem; }
    .serpapi-card h2 { margin: .55rem 0; }
    .serpapi-card h2 a { color: var(--text); text-decoration: none; }
    .serpapi-card h2 a:hover { color: var(--pink-light); }
    .serpapi-card > p { font-size: .86rem; }
    .serpapi-card .search-form { margin-bottom: 0; padding: 1rem; border-color: #39333e; background: #151319; }
    .instagram-profile { margin: 1rem 0 1.5rem; padding: 1.1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .instagram-profile h3 { margin-bottom: .35rem; }
    .instagram-profile h3 a { text-decoration: none; }
    .instagram-profile h3 a:hover { color: var(--pink-light); }
    .instagram-profile > p { margin-bottom: .75rem; }
    .profile-badge { margin-left: .5rem; padding: .2rem .45rem; border-radius: 999px; color: var(--pink-light); background: rgb(240 120 173 / 12%); font-size: .68rem; letter-spacing: 0; vertical-align: middle; }
    .profile-stats { display: flex; flex-wrap: wrap; gap: .6rem 1.2rem; color: var(--muted); font-size: .84rem; }
    .profile-stats strong { color: var(--text); }
    .profile-bio { margin: .8rem 0 0; white-space: pre-line; }

    .erro, .sucesso { padding: .75rem 1rem; border: 1px solid; border-radius: 9px; }
    .erro { border-color: #6c364a; color: #ffb4c8; background: #321b25; }
    .sucesso { border-color: #3d6652; color: #a9e3be; background: #192a21; }
    table { width: 100%; border-collapse: collapse; overflow: hidden; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
    td, th { padding: .75rem; border-bottom: 1px solid var(--border); text-align: left; }
    th { color: var(--pink-light); font-size: .78rem; font-weight: 650; }
    td { color: #ded7e0; font-size: .88rem; }
    tr:last-child td { border-bottom: 0; }
    img.mini { height: 60px; border-radius: 6px; }
    form { margin: 1rem 0; }
    .table-actions { white-space: nowrap; }
    .table-actions form { margin: 0; }
    .table-actions form { display: flex; align-items: center; gap: .5rem; }
    .table-actions select { width: auto; margin: 0; }
    .table-actions button { margin: 0; }
    .users-table-wrap { overflow-x: auto; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    input, select, button {
      min-height: 40px;
      margin: .2rem .35rem .2rem 0;
      padding: .55rem .75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      background: var(--surface);
      font: inherit;
    }
    input[type="file"] { max-width: 100%; }
    input::file-selector-button {
      margin-right: .65rem;
      padding: .35rem .55rem;
      border: 0;
      border-radius: 5px;
      color: var(--pink-light);
      background: rgb(240 120 173 / 12%);
      font: inherit;
      cursor: pointer;
    }
    button { border-color: transparent; color: #21131a; background: var(--pink); font-weight: 650; cursor: pointer; }
    button:hover { background: var(--pink-light); }
    button.button-danger { border-color: #754052; color: #ffd9e8; background: #422331; }
    button.button-danger:hover { border-color: #a74b70; background: #5a2c40; }
    :focus-visible { outline: 2px solid var(--pink-light); outline-offset: 3px; }

    @media (max-width: 700px) {
      .header-inner, .page-content { width: min(100% - 2rem, 560px); }
      .header-inner { min-height: 68px; gap: .5rem; }
      .brand { gap: .5rem; font-size: .84rem; }
      .brand-mark { width: 31px; height: 31px; }
      .main-nav { gap: 0; }
      .main-nav a { padding: .55rem .58rem; font-size: .78rem; }
      .nav-user { padding-inline: .35rem; font-size: .75rem; }
      .nav-logout button { padding-inline: .55rem; font-size: .75rem; }
      .account-usage-heading { align-items: flex-start; flex-direction: column; }
      .page-content { padding-top: 2.5rem; }
      .hero { grid-template-columns: 1fr; gap: 2rem; padding-bottom: 2.8rem; }
      .hero-panel { max-width: 440px; width: 100%; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: .6rem; }
      .section-heading > p { margin: 0; }
      .workflow-grid { grid-template-columns: 1fr; }
      .official-sites > form, .official-page-edit, .creator-child-form { grid-template-columns: 1fr; }
      .official-sites > form button, .official-page-edit button { grid-column: 1; }
      .creator-child-form button { grid-column: 1; }
      .creator-content-list li { align-items: flex-start; flex-wrap: wrap; }
      .creator-content-list li span { flex-basis: calc(100% - 80px); }
    }

    @media (max-width: 390px) {
      .header-inner { width: calc(100% - 1.25rem); }
      .brand-name { max-width: 95px; line-height: 1.15; }
      .main-nav a { padding-inline: .42rem; font-size: .73rem; }
    }

    @media (max-width: 430px) {
      .header-inner { flex-wrap: wrap; justify-content: center; gap: .45rem; padding: .75rem 0; }
      .main-nav { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Monitoramento, página inicial">
        <span class="brand-mark" aria-hidden="true">LS</span>
        <span class="brand-name">Monitoramento</span>
      </a>
      <nav class="main-nav" aria-label="Navegação principal">
        {% if current_user %}
          <a href="/">Início</a>
          <a href="/catalogo">Catálogo</a>
          <a href="/comparar">Comparar</a>
          <a href="/buscar-google">Google</a>
          <a href="/buscar-serpapi">SerpApi</a>
          <a href="/buscar-instagram">Instagram</a>
          <a href="/perfil-busca">Meu perfil</a>
          {% if current_user.role == "admin" %}<a href="/usuarios">Usuários</a>{% endif %}
          <a href="/alterar-senha">Senha</a>
          <span class="nav-user">{{ current_user.username }}</span>
          <form class="nav-logout" method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit">Sair</button>
          </form>
        {% else %}
          <a href="/">Início</a>
          <a href="/login">Entrar</a>
          <a class="nav-highlight" href="/cadastro">Cadastrar</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="page-content">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
